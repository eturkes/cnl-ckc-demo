name: Security scan

# `ci.yml` already runs the whole gate, scanners included, on every push and pull request. This
# workflow exists for the schedule: an advisory published against an unchanged tree has to
# redden something, and nothing pushes on the day it lands.
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      # pnpm from `packageManager`, Node from `devEngines.runtime`: package.json is the one pin.
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: package.json
      - run: pnpm install --frozen-lockfile
      # Dependency advisories, live against the registry feed.
      - run: pnpm audit:check
      # Secret scan over the tree, with its own detector-liveness control.
      - run: pnpm secret:check
      # The network layout's cache (`tools/kb/layout.mjs`), keyed on a superset of its input closure;
      # the entry's own closure digest decides a hit, so a stale restore only costs a recompute.
      - uses: actions/cache@v6
        with:
          path: node_modules/.cache/cnl-ckc-demo/layout
          key: network-layout-${{ hashFiles('kb/*.tar.gz', 'tools/kb/**', 'src/network/**', 'package.json', 'pnpm-lock.yaml') }}
      # The type-aware rules resolve every `@kb` import through `kb/generated`, which only
      # `kb:build` writes; without it each generated-asset member reads as an error type.
      - run: pnpm kb:build
      # Static analysis: eslint-plugin-security, no-unsanitized, svelte/no-at-html-tags.
      - run: pnpm lint
