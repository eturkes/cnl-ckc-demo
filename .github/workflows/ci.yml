name: Verify

# The demo runs locally (user ruling), so CI publishes nothing: it runs the whole gate,
# scanners included, on every push to main and every pull request.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        # Full history: `tests/clinical-records.test.ts` T9 compares frozen surfaces against
        # `git show 22053ef:<path>`, which the default depth-1 checkout cannot resolve.
        with:
          fetch-depth: 0
      # pnpm from `packageManager`, Node from `devEngines.runtime`: package.json is the one pin.
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: package.json
      - run: pnpm install --frozen-lockfile
      # The network layout's cache (`tools/kb/layout.mjs`), keyed on a superset of its input closure;
      # the entry's own closure digest decides a hit, so a stale restore only costs a recompute.
      - uses: actions/cache@v6
        with:
          path: node_modules/.cache/cnl-ckc-demo/layout
          key: network-layout-${{ hashFiles('kb/*.tar.gz', 'tools/kb/**', 'src/network/**', 'package.json', 'pnpm-lock.yaml') }}
      - run: pnpm gate
