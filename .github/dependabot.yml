version: 2

updates:
  # `swipl-wasm` is exact-pinned because production calls three undeclared APIs off it, so
  # every bump has to re-verify them against the shipped `.d.ts` (`.claude/rules/engine.md`).
  # Dependabot still opens the PR; the gate and that re-verification decide it.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      dev-toolchain:
        dependency-type: development
        update-types: [minor, patch]
    ignore:
      # typescript-eslint stable caps at TypeScript < 6.1.
      - dependency-name: typescript
        versions: ['>=6']

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
