<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Graph timeout control</title>
  </head>
  <body>
    <script type="module">
      window.timeoutControl = {
        armed: true,
        wait: () =>
          new Promise(() => {
            document.documentElement.dataset.waiting = 'true';
          }),
      };
    </script>
  </body>
</html>
